<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Converting</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      width: min(560px, 90vw);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      background: rgba(26, 26, 26, 0.9);
      color: #ffffff;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .title {
      font-size: 24px;
      letter-spacing: 0.4px;
      margin-bottom: 14px;
    }

    .bar {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .bar::before {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgb(187, 153, 255) 0%, #c27ac7 50%, rgb(148, 117, 209) 100%);
      animation: slide 1.2s ease-in-out infinite;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.78;
    }

    @keyframes slide {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(250%);
      }
    }
  </style>
</head>

<body>
  <div class="panel" role="status" aria-live="polite" aria-label="Converting">
    <div class="title">Converting...</div>
    <div class="bar"></div>
    <div class="hint">Please wait while conversion completes</div>
  </div>
</body>

</html>
